<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-color: beige;
            font-family: arial;
        }

        .tabla{
            display: grid;
            grid-template-columns: 200px 150px 100px;
            margin-bottom: 5px;
            column-gap: 5px;
            row-gap: 5px;
        }

        .add-button{
            background-color: green;
            color: white;
        }

        .delete-button{
            background-color: red;
            color: white;
            padding: 5px;
        }

        .input-tarea, .input-fecha{
            padding: 5px;
            border-radius: 5px;
        }


    </style>




</head>
<body>
    
    <p>Lista:</p>
    <div class="tabla">
        <input class="input-tarea" type="text" placeholder="Tarea:">
        <input class="input-fecha" type="date">

        <button class="add-button" onclick="
            crearTarea()
        ">Add</button>
    </div>
    

    <div class="lista-tareas tabla"></div>


    





    <script>
        const array = [1,2,3]
        array[0] = 99;

        let array2 = [1, 'hello', true, {name: 'socks'}, [1,2]];

        // Para ver si es un array o no
        Array.isArray([1,2])

        array.push(100)
        console.log(array.length)

        // con splice podemos quitar un valor. El primer numero es el indice donde empieza y el segundo cuantos numeros borra
        array.splice(0,1)


        const tareas = [];


        function crearTarea(){
            const inputTarea = document.querySelector('.input-tarea');
            const inputFecha = document.querySelector('.input-fecha');

            tareas.push({
                tarea: inputTarea.value,
                fecha: inputFecha.value
            })

            inputTarea.value = '';
            inputFecha.value = '';

            mostrarTareas()
        }

        function mostrarTareas(){

            let html = '';

            for(let i=0; i<tareas.length; i++){
                const tareaObject = tareas[i];
                const tarea = tareaObject.tarea;
                const fecha = tareaObject.fecha;

                html += `
                <div>${tarea}</div>
                <div>${fecha}</div>
                <button class="delete-button" onclick="
                        tareas.splice(${i},1);
                        mostrarTareas();
                ">Delete</button>
                `;

            }
            document.querySelector('.lista-tareas').innerHTML = html;
        }

        



    </script>


</body>
</html>
