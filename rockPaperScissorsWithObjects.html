<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .pcplay{
            color: red;
        }

        h2{
            text-align: center;
        }

        div{
            display: flex;
            justify-content: space-around;
        }

        .message{
            text-align: center;
            color: red;
            font-weight: bold;
        }

        .scoreMessage{
            text-align: center;
        }

    </style>
</head>
<body>
    

    <h2>Rock, Paper, Scissors</h2>

    <div>

        <button onclick="
        
        playGame('Rock');

        ">Rock</button>


        <button onclick="

        playGame('Paper');

        ">Paper</button>


        <button onclick="
        
        playGame('Scissors')

        ">Scissors</button>

        <button onclick="resetScore();">Reset</button>

    </div>
    
    <p class="message">Click buttons to start the game.</p>
    <p class="scoreMessage">Wins: 0, Losses: 0, Ties: 0.</p>


    <script>
        alert('Hello')
        let message = document.querySelector('.message');
        let scoreMessage = document.querySelector('.scoreMessage');

        const score = {
            wins: 0,
            losses: 0,
            ties: 0
        };


        function pickComputerMove(){
            const randomNumber = Math.random();
            let pcMove = '';

            if(randomNumber >= 0 && randomNumber < 1/3){
            pcMove = 'Rock';
            }
            else if(randomNumber >= 1/3 && randomNumber < 2/3){
                pcMove = 'Paper';
            }
            else if(randomNumber >= 2/3 && randomNumber < 1){
                pcMove = 'Scissors';
            }

            return pcMove;
        }

        function resetScore(){
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;

            message.textContent = 'Score reseted';
            scoreMessage.textContent = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}.`
        }   

        function playGame(playerChoice){
            const pcMove = pickComputerMove();
            let result = '';

            if(playerChoice === 'Rock'){
                if(pcMove === 'Rock'){
                    result = 'Draw';
                    score.ties ++;
                }
                else if(pcMove === 'Paper'){
                    result = 'Computer wins';
                    score.losses ++;
                }
                else{
                    result = 'Player wins';
                    score.wins ++;
                    alert('You win!')
                }   
            }
            else if(playerChoice === 'Paper'){
                if(pcMove === 'Rock'){
                    result = 'Player wins';
                    score.wins ++;
                    alert('You win!');
                }
                else if(pcMove === 'Paper'){
                    result = 'Draw';
                    score.ties ++;
                }
                else{
                    result = 'Computer wins';
                    score.losses ++;
                }
            }
            else{
                if(pcMove === 'Rock'){
                    result = 'Computer wins';
                    score.losses ++;
                }
                else if(pcMove === 'Paper'){
                    result = 'Player wins';
                    score.wins ++;
                    alert('You win!');
                }
                else{
                    result = 'Draw';
                    score.ties ++;
                }
            }

            message.textContent = `Computer played ${pcMove}, ${result}.`;
            scoreMessage.textContent = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}.`;

        }        
        
    </script>


</body>
</html>
