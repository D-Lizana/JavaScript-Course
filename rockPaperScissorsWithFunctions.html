<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .pcplay{
            color: red;
        }

        h2{
            text-align: center;
        }

        div{
            display: flex;
            justify-content: space-around;
        }

        .message{
            text-align: center;
            color: red;
            font-weight: bold;
        }

    </style>
</head>
<body>
    

    <h2>Rock, Paper, Scissors</h2>

    <div>

        <button onclick="
        let message = document.querySelector('.message');


        const pcMove = pickComputerMove();

        if(pcMove === 'Rock'){
            message.textContent = `Computer played ${pcMove}. Draw`;
        }
        else if(pcMove === 'Paper'){
            message.textContent = `Computer played ${pcMove} Computer wins.`;
        }
        else{
            message.textContent = `Computer played ${pcMove}. Player wins.`;
            alert('You win!')
        }
        ">Rock</button>


        <button onclick="
        
        let message = document.querySelector('.message');


        pickComputerMove();

        if(pcMove === 'Rock'){
            message.textContent = `Computer played ${pcMove}. Player wins.`;
            alert('You win!')
        }
        else if(pcMove === 'Paper'){
            message.textContent =  `Computer played ${pcMove}. Draw`; 
        }
        else{
            message.textContent = `Computer played ${pcMove} Computer wins.`;
        }
        ">Paper</button>


        <button onclick="
        
        
        let message = document.querySelector('.message');
        

        pickComputerMove();

        if(pcMove === 'Rock'){
            message.textContent = `Computer played ${pcMove} Computer wins.`; 
        }
        else if(pcMove === 'Paper'){
            message.textContent = `Computer played ${pcMove}. Player wins.`; 
            alert('You win!')
        }
        else{
            message.textContent = `Computer played ${pcMove}. Draw`;
        }
        ">Scissors</button>

    </div>
    
    <p class="message">Player Wins</p>


    <script>
        alert('Hello')


        function pickComputerMove(){
            const randomNumber = Math.random();
            let pcMove = '';

            if(randomNumber >= 0 && randomNumber < 1/3){
            pcMove = 'Rock';
            }
            else if(randomNumber >= 1/3 && randomNumber < 2/3){
                pcMove = 'Paper';
            }
            else if(randomNumber >= 2/3 && randomNumber < 1){
                pcMove = 'Scissors';
            }

            return pcMove;
        }
        
    </script>


</body>
</html>
