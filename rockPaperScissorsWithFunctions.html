<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .pcplay{
            color: red;
        }

        h2{
            text-align: center;
        }

        div{
            display: flex;
            justify-content: space-around;
        }

        .message{
            text-align: center;
            color: red;
            font-weight: bold;
        }

    </style>
</head>
<body>
    

    <h2>Rock, Paper, Scissors</h2>

    <div>

        <button onclick="
        
        playGame('Rock');

        ">Rock</button>


        <button onclick="

        playGame('Paper');

        ">Paper</button>


        <button onclick="
        
        playGame('Scissors')

        ">Scissors</button>

    </div>
    
    <p class="message">Player Wins</p>


    <script>
        alert('Hello')
        let message = document.querySelector('.message');


        function pickComputerMove(){
            const randomNumber = Math.random();
            let pcMove = '';

            if(randomNumber >= 0 && randomNumber < 1/3){
            pcMove = 'Rock';
            }
            else if(randomNumber >= 1/3 && randomNumber < 2/3){
                pcMove = 'Paper';
            }
            else if(randomNumber >= 2/3 && randomNumber < 1){
                pcMove = 'Scissors';
            }

            return pcMove;
        }

        function playGame(playerChoice){
            const pcMove = pickComputerMove();
            let result = '';

            if(playerChoice === 'Rock'){
                if(pcMove === 'Rock'){
                    result = 'Draw';
                }
                else if(pcMove === 'Paper'){
                    result = 'Computer wins';
                }
                else{
                    result = 'Player wins';
                    alert('You win!')
                }   
            }
            else if(playerChoice === 'Paper'){
                if(pcMove === 'Rock'){
                    result = 'Player wins';
                    alert('You win!');
                }
                else if(pcMove === 'Paper'){
                    result = 'Draw';
                }
                else{
                    result = 'Computer wins';
                }
            }
            else{
                if(pcMove === 'Rock'){
                    result = 'Computer wins';
                }
                else if(pcMove === 'Paper'){
                    result = 'Player wins';
                    alert('You win!');
                }
                else{
                    result = 'Draw';
                }
            }

            message.textContent = `Computer played ${pcMove}, ${result}.`;

        }        
        
    </script>


</body>
</html>
