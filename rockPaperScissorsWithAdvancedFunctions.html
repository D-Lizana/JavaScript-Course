<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            color: white;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
        }

        .pcplay{
            color: red;
        }

        h1{
            text-align: center;
        }

        h2{
            text-align: center;
        }

        div{
            display: flex;
            justify-content: space-around;
        }

        .message{
            text-align: center;
            color: red;
            font-weight: bold;
        }

        .scoreMessage{
            text-align: center;
        }

        button{
            background-color: transparent;
            border: 2px solid white;
            border-radius: 100px;
            padding: 2rem;
            width: 160px;
            height: 160px;
            cursor: pointer;
        }

        .reset, .auto-play{
            background-color: white;
            margin-top: 2rem;
            font-size: 30px;
            border: none;
            border-radius: 100px;
            display: block;
            margin: 20px auto;
            
        }

        .icon{
            width: 80px;
        }

    </style>
</head>
<body>
    

    <h1>Rock, Paper, Scissors</h1>

    <div>

        <button onclick="
        
        playGame('rock');

        "><img class="icon" src="img/rock-emoji.png" alt="Rock"></button>


        <button onclick="

        playGame('paper');

        "><img class="icon" src="img/paper-emoji.png" alt="Paper"></button>


        <button onclick="
        
        playGame('scissors')

        "><img class="icon" src="img/scissors-emoji.png" alt="Scissors"></button>

    </div>

    <button class="reset" onclick="resetScore();">Reset</button>
    <button class="auto-play" onclick="autoPlay();">Auto Play</button>
    
    <p class="message">Click buttons to start the game.</p>
    <h2 class="resultado"></h2>
    <p class="scoreMessage">Wins: 0, Losses: 0, Ties: 0.</p>


    <script>
        alert('Hello')

        const score = JSON.parse(localStorage.getItem('saveScore')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };
        
        let message = document.querySelector('.message');
        let scoreMessage = document.querySelector('.scoreMessage');
        updateScoreMessage();


        function pickComputerMove(){
            const randomNumber = Math.random();
            let pcMove = '';

            if(randomNumber >= 0 && randomNumber < 1/3){
            pcMove = 'rock';
            }
            else if(randomNumber >= 1/3 && randomNumber < 2/3){
                pcMove = 'paper';
            }
            else if(randomNumber >= 2/3 && randomNumber < 1){
                pcMove = 'scissors';
            }

            return pcMove;
        }

        function resetScore(){
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;

            message.textContent = 'Score reseted';
            updateScoreMessage();
            localStorage.setItem('saveScore', JSON.stringify(score));
        }   


        function updateScoreMessage(){
            scoreMessage.textContent = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}.`;
        }


        function playGame(playerChoice){
            const pcMove = pickComputerMove();
            let result = '';
            const resultado = document.querySelector('.resultado');

            if(playerChoice === 'rock'){
                if(pcMove === 'rock'){
                    result = 'Draw';
                    score.ties ++;
                }
                else if(pcMove === 'paper'){
                    result = 'Computer wins';
                    score.losses ++;
                }
                else{
                    result = 'Player wins';
                    score.wins ++;
                }   
            }
            else if(playerChoice === 'paper'){
                if(pcMove === 'rock'){
                    result = 'Player wins';
                    score.wins ++;
                }
                else if(pcMove === 'paper'){
                    result = 'Draw';
                    score.ties ++;
                }
                else{
                    result = 'Computer wins';
                    score.losses ++;
                }
            }
            else{
                if(pcMove === 'rock'){
                    result = 'Computer wins';
                    score.losses ++;
                }
                else if(pcMove === 'paper'){
                    result = 'Player wins';
                    score.wins ++;
                }
                else{
                    result = 'Draw';
                    score.ties ++;
                }
            }

            message.innerHTML = `You played <img class="icon" src="img/${playerChoice}-emoji.png" alt="${playerChoice}">,
            Computer played <img class="icon" src="img/${pcMove}-emoji.png" alt="${pcMove}">`;

            resultado.textContent = `${result.toUpperCase()}.`

            updateScoreMessage();
            localStorage.setItem('saveScore', JSON.stringify(score));
        }

        let isAutoPlaying = false;
        let intervalId;
        
        function autoPlay(){
            if (!isAutoPlaying){
                intervalId = setInterval(function(){
                    const playerMove = pickComputerMove();
                    playGame(playerMove)
                }, 3000);
                isAutoPlaying = true;
            }
            else{
                clearInterval(intervalId);
                isAutoPlaying = false;
            }
            
        }

        
        
    </script>


</body>
</html>
