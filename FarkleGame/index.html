<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farkle - 2 Jugadores</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body class="bg-gray-800 text-gray-500 flex flex-col min-h-screen font-sans">
    <script src="https://cdn.tailwindcss.com"></script>

    <header class="bg-gray-900 text-white text-center p-4">
        <h1 class="text-5xl">🎲 Farkle</h1>
    </header>

    <main class="flex flex-col items-center p-8">
        <!-- Panel de jugadores -->
        <section class="flex justify-around w-full mb-8">
        <div class="bg-white p-4 sm:p-8 rounded-xl shadow-md text-center w-48" id="player1">
            <h2 class="mb-2">Jugador 1</h2>
            <p>Puntos: <span class="score">0</span></p>
        </div>
        <div class="bg-white p-4 sm:p-8 rounded-xl shadow-md text-center w-48" id="player2">
            <h2 class="mb-2">Jugador 2</h2>
            <p>Puntos: <span class="score">0</span></p>
        </div>
        </section>

        <!-- Zona central de juego -->
        <section class="text-center game-area">
        <div class="flex gap-4 justify-around mb-6">
            <!-- Los dados aparecerán aquí -->
            <img src="images/dice1.png" alt="Dado 1" class="w-36 h-36 object-contain bg-white p-2 rounded-xl shadow-md dice">
            <img src="images/dice2.png" alt="Dado 2" class="w-36 h-36 object-contain bg-white p-2 rounded-xl shadow-md dice">
            <img src="images/dice3.png" alt="Dado 3" class="w-36 h-36 object-contain bg-white p-2 rounded-xl shadow-md dice">
            <img src="images/dice4.png" alt="Dado 4" class="w-36 h-36 object-contain bg-white p-2 rounded-xl shadow-md dice">
            <img src="images/dice5.png" alt="Dado 5" class="w-36 h-36 object-contain bg-white p-2 rounded-xl shadow-md dice">
            <img src="images/dice6.png" alt="Dado 6" class="w-36 h-36 object-contain bg-white p-2 rounded-xl shadow-md dice">
        </div>

        <div class="mb-4 controls">
            <button class="px-6 py-2 mx-2 border-none rounded-md bg-blue-600 text-white text-lg hover:bg-blue-700 transition" id="roll">🎲 Tirar Dados</button>
            <button class="px-6 py-2 mx-2 border-none rounded-md bg-blue-600 text-white text-lg hover:bg-blue-700 transition" id="hold">✅ Plantarse</button>
        </div>

        <p class="message text-white font-bold mt-4">Turno del Jugador 1</p>
        </section>
    </main>

    <footer class="bg-gray-900 text-white text-center p-4">
        <p>Farkle - Proyecto Web</p>
    </footer>



    <script src="miscript.js"></script>

</body>
</html>
