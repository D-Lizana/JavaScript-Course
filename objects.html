<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects</title>
</head>
<body>
    

    <script>

        const product = {
            name: 'socks',
            price: 10
        };

        product.name = 'cotton socks';
        
        // dot notation
        console.log(product.name)

        product.newProperty = true;
        console.log(product.newProperty);

        // para saber que tipo de objeto es.
        console.log(typeof product);

        const product2 = {
            name: 'tshirt',
            ['delivery-time']: '1 day',
            // podemos añadir un objeto dentro de un objeto
            rating: {
                stars: 4.5,
                count: 87
            },
            // tambien podemos incluir funciones dentro del objeto ya que las funciones son solo otro tipo de valor en javascript
            fun: function function1(){
                console.log('function inside object')
            }
        };

        // Otra forma de acceder a los atributos del objeto con bracket notation en
        // Es util porque podemos usar palabras que incluyan simbolos como -
        console.log(product2['delivery-time']);

        // para acceder a los objetos dentro de objetos usamos las tecnicas anteriores
        console.log(product2.rating.stars)

        // ahora para acceder al valor de la funcion dentro de un objeto, simplemente llamamos al método del objeto
        product2.fun();


        // Ahora vamos a ver JSON (JavaScript Object Notation)

        // Para convertir el objeto a formato JSON, pero no trabaa con las funciones
        const jsonString = JSON.stringify(product2);

        // Para pasar de string a JSON
        JSON.parse(jsonString);


        // Para guardar informacion en local:

        localStorage.setItem('nombreDelArchivo','String que vamos a guardar');
        //Para recuperar el archivo
        localStorage.getItem('nombreDelArchivo');

        // para borrar el archivo
        localStorage.removeItem('nombreDelArchivo');



        // Los objetos son solo referencias en la memoria del ordenador
        const objeto1 = {
            mensage: 'hola'
        };

        // cuando copiamos un objeto, en realidad solo estamos copiando la referencia a ese punto en la memoria (Copy By Reference)
        // asi no gastamos mas memoria al designar nuevos objetos
        const objeto2 = objeto1;

        objeto1.mensage = 'Cambio';
        // Se puede cambiar el mensaje dentro del objeto aunque el objeto sea const, ya que lo que no puede cambiar es la referencia a la memoria, pero si el contenido
        // si llamamos a objeto2 tambien se habra realizado el cambio porque la referencia es la misma

        const objeto3 = {
            mensaje: 'Cambio',
            precio: 500
        }

        // no se pueden comparar objetos, solo sus atributos internos. Por eso el resultado es falso
        console.log(objeto2 === objeto3)

        // const mensaje = objeto3.mensaje;
        // con la desestructuracion podemos guardar en variables las propiedades del objeto
        const {mensaje, precio} = objeto3;


    </script>


</body>
</html>
