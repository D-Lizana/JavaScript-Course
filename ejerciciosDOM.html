<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Ejercicio 1 -->
    <button>Ejercicio 1</button>

    <button class="boton2">Ejercicio 2</button>


    <button class="heads" onclick="
        const game = document.querySelector('.game');
        game.textContent = 'You chose: heads'
    ">heads</button>
        
    <button class="tails" onclick="
        const game = document.querySelector('.game');
        game.textContent = 'You chose: tails'
    ">tails</button>

    <p class="game"></p>



    <!-- Ejercicio 2 --> 

    <input class="name-input" type="text" placeholder="Enter your name:" onkeydown="
        if(event.key === 'Enter'){
            showName();
        }
    ">

    <button onclick="
        showName();
    ">Submit</button>

    <p class="name-p"></p>


    <!-- Ejercicio 3 --> 
    <input type="text" placeholder="Write something:" onkeyup="
        const escribir = document.querySelector('.escribir');
        escribir.innerHTML += event.key;
    ">
    <p class="escribir"></p>



    <script>
        const boton = document.querySelector('button')
        console.log(boton)

        let boton2 = document.querySelector('.boton2')
        boton2.innerHTML = 'Completado';

        function showName(){
            const nameInput = document.querySelector('.name-input')

            const name = document.querySelector('.name-p')
            name.innerHTML = `Your name is ${nameInput.value}.`
        }

    </script>


    
</body>
</html>
